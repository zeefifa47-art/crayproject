name: Build DRAX
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KS_PASS: ${{ secrets.KS_PASS || 'cray-hazi-2026' }}
      KS_ALIAS: cray
      KS_B64: ${{ secrets.KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Siapkan Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
          sudo chown -R "$USER" "$ANDROID_HOME" || true
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
          fi

      - name: Ekstrak zip
        run: |
          mkdir -p proj
          unzip -q -o DRAX-project.zip -d proj

      - name: Matikan R8 (sementara)
        run: |
          sed -i 's/minifyEnabled true/minifyEnabled false/; s/shrinkResources true/shrinkResources false/' proj/app/build.gradle
          grep -n "minifyEnabled\|shrinkResources" proj/app/build.gradle

      - name: Kompilasi komponen native (arm64)
        run: |
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_NDK_LATEST_HOME:-}}}"
          if [ -z "$NDK" ]; then NDK="$ANDROID_SDK_ROOT/ndk/$(ls "$ANDROID_SDK_ROOT/ndk" | sort -V | tail -1)"; fi
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          mkdir -p proj/app/src/main/assets
          "$CC" -O2 -Wall -s -o proj/app/src/main/assets/draxsensid proj/native/draxsensid.c
          ls -la proj/app/src/main/assets

      - name: Restore keystore
        uses: actions/cache@v4
        with:
          path: cray.jks
          key: cray-keystore-v1

      - name: Siapkan keystore
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > cray.jks
          elif [ ! -f cray.jks ]; then
            keytool -genkeypair -keystore cray.jks -alias cray -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=DRAX, O=inihazi, C=ID"
          fi

      - name: Ikat QR donasi ke tanda tangan
        run: |
          pip install -q cryptography --break-system-packages || pip install -q cryptography
          keytool -exportcert -keystore cray.jks -alias cray -storepass "$KS_PASS" -file cert.der
          python3 proj/tools/bind_qr.py cert.der proj/secret/qris.jpg proj/app/src/main/assets/q.bin

      - name: Build APK
        working-directory: proj
        env:
          KS_FILE: ${{ github.workspace }}/cray.jks
        run: |
          set +e
          gradle :app:assembleRelease --no-daemon --stacktrace --warning-mode none 2>&1 | tee ../build.log
          code=${PIPESTATUS[0]}
          grep -E "error:|e: |What went wrong|Execution failed|AAPT|Caused by|SDK location|Failed to find" -A1 ../build.log | head -9 | while IFS= read -r l; do echo "::error::$l"; done
          exit $code

      - name: Build AAB (opsional)
        working-directory: proj
        continue-on-error: true
        env:
          KS_FILE: ${{ github.workspace }}/cray.jks
        run: gradle :app:bundleRelease --no-daemon --warning-mode none

      - name: Kumpulkan APK
        run: |
          mkdir -p out
          cp proj/app/build/outputs/apk/release/DRAX-release.apk out/DRAX.apk
          ls -la out

      - name: Buat APKS dan XAPK
        if: ${{ hashFiles('proj/app/build/outputs/bundle/release/*.aab') != '' }}
        continue-on-error: true
        run: |
          AAB=$(find proj/app/build/outputs/bundle/release -name '*.aab' | head -1)
          curl -sL -o bt.jar https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar
          java -jar bt.jar build-apks \
            --bundle="$AAB" \
            --output=out/DRAX.apks --mode=default \
            --ks=cray.jks --ks-pass=pass:"$KS_PASS" \
            --ks-key-alias=cray --key-pass=pass:"$KS_PASS"
          rm -rf x && mkdir x && unzip -q out/DRAX.apks -d x
          python3 - <<'PY'
          import glob, json, os, zipfile
          files = sorted(glob.glob('x/splits/*.apk'))
          def sid(f):
              n = os.path.basename(f)[:-4]
              return 'base' if n == 'base-master' else 'config.' + n.replace('base-', '')
          m = {
            "xapk_version": 2,
            "package_name": "com.cray.hazi",
            "name": "DRAX",
            "version_code": "1",
            "version_name": "1.0.0",
            "min_sdk_version": "26",
            "target_sdk_version": "35",
            "permissions": [],
            "split_apks": [{"file": os.path.basename(f), "id": sid(f)} for f in files],
          }
          with zipfile.ZipFile('out/DRAX.xapk', 'w', zipfile.ZIP_DEFLATED) as z:
              z.writestr('manifest.json', json.dumps(m))
              for f in files:
                  z.write(f, os.path.basename(f))
          PY
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: DRAX
          path: out/*
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
          
