name: Build DRAX
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.KS_PASS || 'cray-hazi-2026' }}
      KS_ALIAS: cray
      KS_B64: ${{ secrets.KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ekstrak zip
        run: |
          mkdir -p proj
          unzip -q -o DRAX-project.zip -d proj

      - name: Restore keystore
        uses: actions/cache@v4
        with:
          path: cray.jks
          key: cray-keystore-v1

      - name: Siapkan keystore
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > cray.jks
          elif [ ! -f cray.jks ]; then
            keytool -genkeypair -keystore cray.jks -alias cray -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=DRAX, O=inihazi, C=ID"
          fi

      - name: Ikat QR donasi ke tanda tangan
        run: |
          pip install -q cryptography --break-system-packages || pip install -q cryptography
          keytool -exportcert -keystore cray.jks -alias cray -storepass "$KS_PASS" -file cert.der
          python3 proj/tools/bind_qr.py cert.der proj/secret/qris.jpg proj/app/src/main/assets/q.bin
          ls -la proj/app/src/main/assets

      - name: Build APK dan AAB
        working-directory: proj
        env:
          KS_FILE: ${{ github.workspace }}/cray.jks
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Siapkan hasil
        run: |
          mkdir -p out
          cp proj/app/build/outputs/apk/release/DRAX-release.apk out/DRAX.apk
          AAB=$(find proj/app/build/outputs/bundle/release -name '*.aab' | head -1)
          curl -sL -o bt.jar https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar
          java -jar bt.jar build-apks \
            --bundle="$AAB" \
            --output=out/DRAX.apks --mode=default \
            --ks=cray.jks --ks-pass=pass:"$KS_PASS" \
            --ks-key-alias=cray --key-pass=pass:"$KS_PASS"
          rm -rf x && mkdir x && unzip -q out/DRAX.apks -d x
          python3 - <<'PY'
          import glob, json, os, zipfile
          files = sorted(glob.glob('x/splits/*.apk'))
          def sid(f):
              n = os.path.basename(f)[:-4]
              return 'base' if n == 'base-master' else 'config.' + n.replace('base-', '')
          m = {
            "xapk_version": 2,
            "package_name": "com.cray.hazi",
            "name": "DRAX",
            "version_code": "1",
            "version_name": "1.0.0",
            "min_sdk_version": "26",
            "target_sdk_version": "35",
            "permissions": [],
            "split_apks": [{"file": os.path.basename(f), "id": sid(f)} for f in files],
          }
          with zipfile.ZipFile('out/DRAX.xapk', 'w', zipfile.ZIP_DEFLATED) as z:
              z.writestr('manifest.json', json.dumps(m))
              for f in files:
                  z.write(f, os.path.basename(f))
          PY
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: DRAX
          path: |
            out/DRAX.apk
            out/DRAX.apks
            out/DRAX.xapk
